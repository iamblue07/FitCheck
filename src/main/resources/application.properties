spring.application.name=sewlect
logging.level.root=INFO
logging.level.com.sewlect=${LOG_LEVEL_SEWLECT:INFO}
logging.level.com.sewlect.security.audit=${LOG_LEVEL_AUDIT:INFO}
logging.pattern.correlation=[%X{correlationId:-}] 
logging.include-application-name=false

spring.config.import=optional:file:.env.local[.properties]

management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}&sslrootcert=${DB_SSL_CERT_PATH:}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

r2.endpoint=${R2_S3_API}
r2.account-id=${R2_ACCOUNT_ID}
r2.bucket=${R2_BUCKET}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.region=auto

jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=https://sewlect.local
jwt.audience=sewlect-api

auth.rate-limit.per-ip-limit=20
auth.rate-limit.per-email-limit=10
auth.rate-limit.window=15m

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

catalog.import.enabled=${CATALOG_IMPORT_ENABLED:false}
catalog.import.styles-csv-path=${CATALOG_STYLES_CSV_PATH:}
catalog.import.images-csv-path=${CATALOG_IMAGES_CSV_PATH:}

spring.ai.model.chat=${OLLAMA_ENABLED:ollama}
spring.ai.model.embedding=${OLLAMA_ENABLED:ollama}
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

spring.ai.ollama.chat.model=${OLLAMA_ENRICHMENT_MODEL:qwen3-vl:4b}
catalog.enrichment.limit-enabled=${CATALOG_ENRICHMENT_LIMIT_ENABLED:false}
catalog.enrichment.max-items=${CATALOG_ENRICHMENT_MAX_ITEMS:9}
catalog.enrichment.batch-enabled=${CATALOG_ENRICHMENT_BATCH_ENABLED:false}

spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:4b}
catalog.embedding.batch-enabled=${CATALOG_EMBEDDING_BATCH_ENABLED:false}
catalog.embedding.limit-enabled=${CATALOG_EMBEDDING_LIMIT_ENABLED:false}
catalog.embedding.max-items=${CATALOG_EMBEDDING_MAX_ITEMS:9}
catalog.embedding.chunk-size=${CATALOG_EMBEDDING_CHUNK_SIZE:500}

catalog.role-backfill.enabled=${CATALOG_ROLE_BACKFILL_ENABLED:false}

spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=15m
spring.ai.ollama.chat.num-ctx=8192

ollama.cloud.base-url=${OLLAMA_CLOUD_BASE_URL:https://ollama.com}
ollama.cloud.api-key=${OLLAMA_CLOUD_API_KEY}
ollama.cloud.connect-timeout=5s
ollama.cloud.read-timeout=60s
ollama.cloud.max-retries=1
ollama.cloud.retry-delay=2s

deepinfra.base-url=${DEEPINFRA_BASE_URL:https://api.deepinfra.com/v1/openai}
deepinfra.api-key=${DEEPINFRA_API_KEY}
deepinfra.embedding-model=${DEEPINFRA_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-4B}

outfit.compatibility.structured-weight=0.2
outfit.compatibility.embedding-weight=0.8

outfit.generation.batch-size=50
outfit.generation.max-generation-attempts=500
outfit.generation.budget-tolerance=0.10
outfit.generation.top-k-per-slot=15
outfit.generation.beam-width=3

outfit.swap.alternative-limit=20

outfit.prompt.max-blueprints=2
outfit.prompt.top-k-per-slot=3
outfit.prompt.rate-limit-per-hour=200

feed.ranking.personalization-weight=0.15
feed.ranking.style-weight=0.5
feed.ranking.budget-weight=0.5

feed.page-size=20
feed.refill-threshold=30

feed.executor.core-pool-size=2
feed.executor.max-pool-size=4
feed.executor.queue-capacity=20

social.default-page-size=20
social.max-page-size=100

common.ratelimit.sweep-interval-ms=300000
common.http-client.connect-timeout=5s

outfit.prompt.generation-pool-size=200
outfit.prompt.batch-size=50

ollama.cloud.chat-model=${OLLAMA_CLOUD_CHAT_MODEL:gpt-oss:20b-cloud}

outfit.diversity.max-product-repetitions=3

fashn.base-url=${FASHN_BASE_URL:https://api.fashn.ai/v1}
fashn.api-key=${FASHN_API_KEY}
fashn.connect-timeout=5s
fashn.read-timeout=30s
fashn.result-download-timeout=60s

tryon.rate-limit-per-hour=20
tryon.max-retries-per-item=1
tryon.retry-backoff-ms=2000
tryon.poll-interval-ms=3000
tryon.poll-timeout-ms=180000
tryon.job-timeout-ms=900000
tryon.stale-in-flight-threshold-ms=1200000
tryon.stale-sweep-interval-ms=300000
tryon.executor.core-pool-size=2
tryon.executor.max-pool-size=6
tryon.executor.queue-capacity=20

tryon.fashn.v16-model-name=tryon-v1.6
tryon.fashn.v16-mode=balanced
tryon.fashn.max-model-name=tryon-max
tryon.fashn.max-resolution=1k
tryon.fashn.max-generation-mode=fast
tryon.fashn.output-format=jpeg