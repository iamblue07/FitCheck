spring.application.name=fitcheck
logging.level.root=INFO
logging.level.com.fitcheck=DEBUG

spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}&sslrootcert=${DB_SSL_CERT_PATH:}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

r2.endpoint=${R2_S3_API}
r2.account-id=${R2_ACCOUNT_ID}
r2.bucket=${R2_BUCKET}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.region=auto

jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

catalog.import.enabled=${CATALOG_IMPORT_ENABLED:false}
catalog.import.styles-csv-path=${CATALOG_STYLES_CSV_PATH:}
catalog.import.images-csv-path=${CATALOG_IMAGES_CSV_PATH:}

spring.ai.model.chat=${OLLAMA_ENABLED:ollama}
spring.ai.model.embedding=${OLLAMA_ENABLED:ollama}
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

spring.ai.ollama.base-url=${OLLAMA_BASE_URL}

spring.ai.ollama.chat.model=${OLLAMA_ENRICHMENT_MODEL}
catalog.enrichment.limit-enabled=${CATALOG_ENRICHMENT_LIMIT_ENABLED}
catalog.enrichment.max-items=${CATALOG_ENRICHMENT_MAX_ITEMS}
catalog.enrichment.batch-enabled=${CATALOG_ENRICHMENT_BATCH_ENABLED}

spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL}
catalog.embedding.batch-enabled=${CATALOG_EMBEDDING_BATCH_ENABLED}
catalog.embedding.limit-enabled=${CATALOG_EMBEDDING_LIMIT_ENABLED}
catalog.embedding.max-items=${CATALOG_EMBEDDING_MAX_ITEMS}
catalog.embedding.chunk-size=${CATALOG_EMBEDDING_CHUNK_SIZE}

catalog.role-backfill.enabled=${CATALOG_ROLE_BACKFILL_ENABLED}

spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=15m
spring.ai.ollama.chat.num-ctx=8192

ollama.cloud.base-url=${OLLAMA_CLOUD_BASE_URL:https://ollama.com}
ollama.cloud.api-key=${OLLAMA_CLOUD_API_KEY}

deepinfra.base-url=${DEEPINFRA_BASE_URL:https://api.deepinfra.com/v1/openai}
deepinfra.api-key=${DEEPINFRA_API_KEY}
deepinfra.embedding-model=${DEEPINFRA_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-4B}

outfit.compatibility.structured-weight=0.2
outfit.compatibility.embedding-weight=0.8

outfit.generation.batch-size=50
outfit.generation.max-generation-attempts=500
outfit.generation.budget-tolerance=0.10
outfit.generation.top-k-per-slot=15
outfit.generation.beam-width=3

outfit.swap.alternative-limit=20

outfit.prompt.max-blueprints=2
outfit.prompt.top-k-per-slot=3
outfit.prompt.rate-limit-per-hour=200

feed.ranking.personalization-weight=0.15
feed.ranking.style-weight=0.5
feed.ranking.budget-weight=0.5

feed.page-size=20
feed.refill-threshold=30

feed.executor.core-pool-size=2
feed.executor.max-pool-size=4
feed.executor.queue-capacity=20

common.ratelimit.sweep-interval-ms=300000

outfit.prompt.generation-pool-size=200
outfit.prompt.batch-size=50

ollama.cloud.chat-model=${OLLAMA_CLOUD_CHAT_MODEL:gpt-oss:20b-cloud}

outfit.diversity.max-product-repetitions=3